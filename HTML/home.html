    * {
      margin: 0;
      box-sizing: border-box;
    }
    .flex-container {
      width: 100vw;
      height: 100vh;
      border: 1px solid red;
      background-color: aqua;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: space-evenly;
    }
    .header {
      width: 100%;
      height: 10%;
      padding: 10px;
      border: 1px solid yellow;
      background-color: chartreuse;
      text-align: center;
      font-size: 2.5rem;
      font-weight: bold;
    }
    .nav {
      width: 100%;
      height: auto;
      border: 1px solid black;
      background-color: gray;
      text-align: center;
      font-size: 1.2rem;
    }
    .nav ul {
      margin: 0;
      padding: 10px;
    }
    .nav ul li {
      list-style-type: none;
      display: inline-flex;
      padding-right: 40px;
    }
    .menu {
      width: 100%;
      height: 80%;
      border: 2px solid blueviolet;
      background-color: yellow;
      display: flex;
    }
    .left {
      width: 15%;
      height: 100%;
      padding: 10px;
      border: 1px solid red;
      background-color: pink;
    }
    .right {
      width: 85%;
      height: 100%;
      padding: 10px;
      border: 2px solid greenyellow;
      background-color: gold;
    }
    .footer {
      width: 100%;
      height: 5%;
      padding: 10px;
      border: 1px solid darkgray;
      background-color: khaki;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
    }

    /* Hamburger button */
    .hamburger {
      display: none;
      cursor: pointer;
      font-size: 2rem;
      background: none;
      border: none;
      margin: 10px;
    }

    /* 📱 Mobile view */
    @media (max-width: 768px) {
      .nav ul {
        display: none; /* hide menu links by default */
        flex-direction: column;
        padding: 0;
      }
      .nav ul li {
        display: block;
        padding: 10px 0;
      }
      .hamburger {
        display: block; /* show hamburger */
        font-size: 1.5rem;
      }
      .menu {
        flex-direction: column; /* stack sidebar and content */
      }
      .left {
        display: none; /* hide sidebar by default */
        width: 100%;
        height: auto;
        font-size: 0.9rem;
      }
      .right {
        width: auto;
        font-size: 0.9rem;
      }
      .nav.active ul {
        display: flex; /* show when active */
      }
      .header {
    font-size: 1.5rem;  /* smaller heading */
  }
  .footer {
    font-size: 0.9rem;  /* smaller footer */
  }
    }
  </style>
</head>
<body>
  <div class="flex-container">
    <div class="header">ABESEC GHAZIABAD</div>

    <!-- Navbar with hamburger -->
    <div class="nav">
      <button class="hamburger" onclick="toggleMenu()">☰</button>
      <ul>
        <li><a href="aboutus.html" target="fr1">About Us</a></li>
        <li><a href="register.html" target="fr1">Register here</a></li>
        <li><a href="login.html" target="fr1">Login</a></li>
        <li><a href="contactus.html" target="fr1">Contact Us</a></li>
      </ul>
    </div>

    <div class="menu">
      <div class="left">Sidebar Menu</div>
      <div class="right">
        <iframe name="fr1" width="100%" height="100%"></iframe>
      </div>
    </div>

    <div class="footer">&copy; 2025 ABESEC GHAZIABAD</div>
  </div>

  <script>
    function toggleMenu() {
      document.querySelector(".nav").classList.toggle("active");
    //   document.querySelector(".left").classList.toggle("active");
    }
  </script>
</body>
</html>
